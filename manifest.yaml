display_information:
  name: Sales Copilot
  description: Turns a sales conversation into a working Revenue Cloud configuration
  background_color: "#1d3752"

features:
  bot_user:
    display_name: Sales Copilot
    always_online: true
  slash_commands:
    - command: /configure
      description: Turn a client request into a product and price configuration
      usage_hint: "(optional) the new offer, in your own words"
      should_escape: false
    - command: /quote
      description: Prepare a priced offer for a customer from the catalog
      usage_hint: "(optional) e.g. Acme wants 120 more Cloud Analytics licences, 5% off"
      should_escape: false

oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.public
      - commands

settings:
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
